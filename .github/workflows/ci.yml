name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Foundry 1.8.5
        uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1.9.2
        with:
          version: v1.8.5
      - name: Build
        run: forge build --sizes
      - name: Tests (six skip themselves without an RPC URL)
        run: forge test -vv
      - name: Formatting of the new Solidity (the relay keeps Zecured's bytes)
        run: forge fmt --check src/interfaces src/examples src/payment test/examples test/deployments test/payment
      - name: ABI files are current
        run: |
          forge inspect src/relay/ZcashHeaderRelay.sol:ZcashHeaderRelay abi --json > ../abi/ZcashHeaderRelay.json
          forge inspect src/interfaces/IZcashHeaderRelayReader.sol:IZcashHeaderRelayReader abi --json > ../abi/IZcashHeaderRelayReader.json
          forge inspect src/payment/IZcashPaymentVerifier.sol:IZcashPaymentVerifier abi --json > ../abi/IZcashPaymentVerifier.json
          git diff --exit-code -- ../abi
      - name: The reader builds with solc 0.8.0, the example with solc 0.8.4
        run: |
          forge build --use 0.8.0 --evm-version istanbul --out "$RUNNER_TEMP/out-0.8.0" \
            --cache-path "$RUNNER_TEMP/cache-0.8.0" src/interfaces/IZcashHeaderRelayReader.sol
          forge build --use 0.8.4 --evm-version istanbul --out "$RUNNER_TEMP/out-0.8.4" \
            --cache-path "$RUNNER_TEMP/cache-0.8.4" src/examples/ZcashFinalityGate.sol

  rust:
    name: Rust crates and the native K4 catalog (no guest)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rust, as rust-toolchain.toml pins it
        run: rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)" --profile minimal --component rustfmt,clippy
      - name: Formatting
        run: cargo fmt -p seam-payment -p seam-chain -p seam-cli -p seam-zkvm-methods -- --check
      - name: Build (the default members; the guest needs risc0-build, see guests.yml)
        run: cargo build --locked
      - name: Tests, with the K4 catalog on both networks' statements (the network tests are ignored)
        run: cargo test --locked
      - name: The Mainnet build of the statement
        run: cargo test --locked -p seam-payment --features mainnet
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  reference:
    name: Python reference re-checks the real header fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: zcash_header_check.py on every real fixture
        run: |
          for f in testnet_recent testnet_nu7_activation testnet_deposit_anchor mainnet_recent; do
            python3 -I contracts/test/relay/tools/zcash_header_check.py fixture "contracts/test/relay/fixtures/$f.json"
          done
