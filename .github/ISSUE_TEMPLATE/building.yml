name: Building on Seam
description: Say what you're building and what you need from the light client.
labels: ["idea"]
body:
  - type: textarea
    id: what
    attributes:
      label: What are you building?
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Which chain, and which Zcash network?
      placeholder: Base Sepolia, Zcash Testnet
  - type: textarea
    id: need
    attributes:
      label: What do you need from Seam?
      description: An interface, a deployment, docs, a feature.
