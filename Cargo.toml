# Seam's Rust crates: the payment statement and, built on it, the chain data, the witness builder and the CLI. The
# zkVM guest is its own workspace (zkvm/guest), built by risc0-build.
[workspace]
resolver = "2"
members = ["crates/seam-payment", "zkvm/methods"]
# risc0-build does not build on Windows: a plain `cargo build` or `cargo test` leaves the guest crate out, and
# `cargo build -p seam-zkvm-methods` builds it on Linux or macOS (RISC0_SKIP_BUILD=1 skips the guest itself).
default-members = ["crates/seam-payment"]

[workspace.package]
edition = "2024"
license = "MIT"

# The statement's elliptic-curve and hash work is unusably slow in tests without optimization.
[profile.dev]
opt-level = 3

[profile.release]
debug = 1
lto = true
