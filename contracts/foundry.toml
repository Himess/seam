[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
# Cancun: EIP-1153 transient storage (TSTORE/TLOAD) for the zZEC "expected transfer from Morpho" guard.
# Live Base Sepolia executes TSTORE/TLOAD (checked with eth_call on 2026-10-10, see docs/spikes/SPIKE_C.md).
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
# script/DeployZecured.s.sol writes deployments/base-sepolia.json (or base-sepolia.dry-run.json in a simulation).
# test/relay reads its Zcash Testnet header fixtures (read-only).
fs_permissions = [
    { access = "read-write", path = "./deployments" },
    { access = "read", path = "./test/relay/fixtures" },
    { access = "read", path = "./script/artifacts" },
]
# Explicit remappings only: morpho-blue and openzeppelin ship their own nested forge-std copies,
# auto-detection could otherwise pick the wrong one.
auto_detect_remappings = false
remappings = [
    "forge-std/=lib/forge-std/src/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "morpho-blue/=lib/morpho-blue/",
]

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
# The invariant suite runs against the real Morpho Blue on a Base Sepolia fork, so the campaign is kept small.
# Deeper runs: FOUNDRY_INVARIANT_RUNS=256 FOUNDRY_INVARIANT_DEPTH=100 forge test --isolate --match-path 'test/invariant/*'
runs = 32
depth = 50
# Handler actions that may legitimately revert use try/catch, so any other revert is a failure.
fail_on_revert = true

[profile.halmos]
# Symbolic checks (docs/TESTING.md § 1b): `FOUNDRY_PROFILE=halmos halmos`, settings in halmos.toml.
# Only test/halmos is built, into its own directories; nothing there needs a fork.
test = "test/halmos"
out = "out/halmos"
cache_path = "cache/halmos"
# Forge >= 1.x links test code dynamically by default and rewrites `new` into `deployCode`, which Halmos 0.3.3
# cannot execute (5 zZEC guard checks fail in setUp). Halmos needs the classic static linking.
dynamic_test_linking = false

[rpc_endpoints]
# Fork tests read BASE_SEPOLIA_RPC_URL directly and fall back to https://sepolia.base.org when unset.
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"

[fmt]
line_length = 120

[lint]
# Style lints apply to src/ only; tests and the throwaway spike helpers are exempt.
ignore = ["test/**/*.sol"]
# - screaming-snake-case-immutable: public immutables (registry(), adapter(), morpho(), ...) are part of the ABI in
#   docs/INTERFACES.md and keep their camelCase names.
# - asm-keccak256: plain keccak256(abi.encode(...)) is kept for readability (EIP-712 hashing must be auditable).
exclude_lints = ["screaming-snake-case-immutable", "asm-keccak256"]
