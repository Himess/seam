[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
# Cancun: EIP-1153 transient storage (TSTORE/TLOAD) for the zZEC "expected transfer from Morpho" guard.
# Live Base Sepolia executes TSTORE/TLOAD (checked with eth_call on 2026-10-10, see docs/spikes/SPIKE_C.md).
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
# Explicit remappings only: morpho-blue and openzeppelin ship their own nested forge-std copies,
# auto-detection could otherwise pick the wrong one.
auto_detect_remappings = false
remappings = [
    "forge-std/=lib/forge-std/src/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "morpho-blue/=lib/morpho-blue/",
]

[profile.default.fuzz]
runs = 256

[rpc_endpoints]
# Fork tests read BASE_SEPOLIA_RPC_URL directly and fall back to https://sepolia.base.org when unset.
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"

[fmt]
line_length = 120

[lint]
# Style lints apply to src/ only; tests and the throwaway spike helpers are exempt.
ignore = ["test/**/*.sol"]
