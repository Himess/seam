[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
# Cancun, as on Base.
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
# script/DeployRelay.s.sol reads a parameter file in config/ and a checkpoint file, and writes
# deployments/<name>.relay.json (a simulation too). The tests read the header fixtures in test/relay/fixtures, the
# parameter files and the deployment records (read-only).
fs_permissions = [
    { access = "read-write", path = "./deployments" },
    { access = "read", path = "./config" },
    { access = "read", path = "./test/relay/fixtures" },
]
# Static test linking. Forge >= 1.x links test code dynamically by default and rewrites `new` of a src/ contract into
# `deployCode`: then `vm.expectRevert` followed by a reverting `new` ends the test as a pass and silently skips every
# later check in it (reproduced with Foundry 1.8.5).
dynamic_test_linking = false
# Explicit remappings only: openzeppelin-contracts ships its own nested forge-std copy, and auto-detection could
# otherwise pick the wrong one.
auto_detect_remappings = false
remappings = [
    "forge-std/=lib/forge-std/src/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
]

[profile.default.fuzz]
runs = 256

[fmt]
line_length = 120

[lint]
# Style lints apply to src/ only; tests are exempt.
ignore = ["test/**/*.sol"]
# - screaming-snake-case-immutable: the relay's public immutables (networkId(), checkpointHash(), checkpointHeight())
#   are part of its ABI and keep their camelCase names.
# - asm-keccak256: plain keccak256 is kept for readability (the network ids are keccak256 of their names).
exclude_lints = ["screaming-snake-case-immutable", "asm-keccak256"]
