[package]
name = "seam-zkvm-methods"
description = "The Seam payment guest, embedded (ELF and image id) by risc0-build for one Zcash network"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[build-dependencies]
risc0-build = "=3.0.6"

[features]
# Builds the guest for Mainnet (the network is a build parameter): build.rs passes it on to the guest.
mainnet = []

[package.metadata.risc0]
methods = ["../guest"]
