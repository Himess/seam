[package]
name = "relay-synthetic-headers"
version = "0.1.0"
edition = "2021"
publish = false
description = "Test-fixture tool: solves Equihash (200, 9) for synthetic Zcash testnet headers (relay fork tests)"
license = "MIT"

# Standalone: not a member of the repository's root workspace.
[workspace]

[dependencies]
# The Equihash crate Zebra and librustzcash use; the `solver` feature builds Tromp's C solver.
equihash = { version = "=0.3.0", features = ["solver"] }
sha2 = "0.10"
hex = "0.4"

[profile.release]
opt-level = 3
