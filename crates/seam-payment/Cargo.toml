[package]
name = "seam-payment"
description = "The statement a Seam payment proof proves: a shielded Ironwood payment for one reference, in the Zcash chain"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

# Explicit versions (no workspace inheritance): the zkVM guest builds this crate in its own workspace. They are the
# versions Zecured's payment statement was built and proven with.
[dependencies]
orchard = { version = "0.16", default-features = false, features = ["std"] }
zcash_primitives = { version = "=0.31.0-pre.1", default-features = false }
zcash_protocol = "=0.11.0-pre.0"
zcash_note_encryption = "0.5"
zcash_history = "0.6"
blake2b_simd = { version = "1", default-features = false }
sha2 = "0.10"
tiny-keccak = { version = "2", features = ["keccak"] }
serde = { version = "1", features = ["derive"] }

[features]
# The network is a build parameter, never a witness field: without this feature the statement proves Testnet payments
# (NU7 epoch), with it Mainnet ones (NU6.3 and NU7 epochs). Each network has its own guest and image id.
mainnet = []
# The K4 catalog and the synthetic fixture's construction (host side; the guest never compiles them).
k4 = []

[dev-dependencies]
serde_json = "1"
seam-payment = { path = ".", features = ["k4"] }
