[package]
name = "seam-cli"
description = "seam: the memo, the witness and the proof of a shielded Ironwood payment for a Seam payment verifier"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "seam"
path = "src/main.rs"

[dependencies]
seam-payment = { path = "../seam-payment" }
seam-chain = { path = "../seam-chain" }
zcash_protocol = "=0.11.0-pre.0"
zcash_keys = { version = "=0.17.0-pre.1", default-features = false, features = ["std", "orchard"] }
zcash_address = "=0.14.0-pre.1"
zip321 = "=0.10.0-pre.1"
orchard = { version = "0.16", default-features = false, features = ["std"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }

[features]
# The Mainnet build: the statement proves Mainnet payments (the NU6.3 and NU7 epochs). Without it, Testnet (NU7). One
# build proves on one network.
mainnet = ["seam-payment/mainnet"]

[dev-dependencies]
seam-payment = { path = "../seam-payment", features = ["k4"] }
# An encoding of the memo parameter independent of zip321's.
base64 = "0.22"
