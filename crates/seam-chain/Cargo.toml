[package]
name = "seam-chain"
description = "Zcash chain data for Seam payment proofs: the ZIP 221 history tree, headers over P2P, compact blocks, witnesses"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

# The versions Zecured's witness builder was built with and used on real Testnet data (27 October 2026); the Zcash
# crates are the pinned pre-releases crates/seam-payment uses.
[dependencies]
seam-payment = { path = "../seam-payment" }
zcash_history = "0.6"
zcash_protocol = "=0.11.0-pre.0"
primitive-types = { version = "0.12", default-features = false }
blake2b_simd = "1"
anyhow = "1"
hex = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
seam-payment = { path = "../seam-payment", features = ["k4"] }
zcash_primitives = { version = "=0.31.0-pre.1", default-features = false }
serde_json = "1"
